<template>
    <lightning-card title="Interview Performance Dashboard" icon-name="standard:dashboard">
        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-is-relative slds-p-around_large">
                <lightning-spinner alternative-text="Loading dashboard data..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Error Messages -->
        <template if:true={hasErrors}>
            <div class="slds-m-bottom_medium">
                <template for:each={errors} for:item="error">
                    <div key={error.id} class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_x-small">
                        <span class="slds-assistive-text">Error</span>
                        <lightning-icon icon-name="utility:error" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        {error.message}
                    </div>
                </template>
            </div>
        </template>

        <!-- Dashboard Controls -->
        <template if:false={isLoading}>
            <div class="dashboard-controls slds-m-bottom_large">
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <lightning-combobox
                            name="timeframe"
                            label="Time Period"
                            value={selectedTimeframe}
                            placeholder="Select time period"
                            options={timeframeOptions}
                            onchange={handleTimeframeChange}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <lightning-combobox
                            name="interviewType"
                            label="Interview Type"
                            value={selectedInterviewType}
                            placeholder="All Interview Types"
                            options={interviewTypeOptions}
                            onchange={handleInterviewTypeChange}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <div class="export-controls">
                            <lightning-button-group>
                                <lightning-button 
                                    label="Export PDF" 
                                    onclick={exportToPDF}
                                    icon-name="utility:download"
                                    variant="neutral">
                                </lightning-button>
                                <lightning-button 
                                    label="Export Excel" 
                                    onclick={exportToExcel}
                                    icon-name="utility:download"
                                    variant="neutral">
                                </lightning-button>
                                <lightning-button 
                                    label="Export CSV" 
                                    onclick={exportToCSV}
                                    icon-name="utility:download"
                                    variant="neutral">
                                </lightning-button>
                            </lightning-button-group>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Key Metrics Summary -->
            <div class="metrics-summary slds-m-bottom_large">
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                        <div class="metric-card">
                            <div class="metric-value">{dashboardData.totalFeedbackRecords}</div>
                            <div class="metric-label">Total Interviews</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                        <div class="metric-card">
                            <div class="metric-value">{formattedAverageRating}</div>
                            <div class="metric-label">Average Rating</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                        <div class="metric-card">
                            <div class="metric-value">{formattedSuccessRate}%</div>
                            <div class="metric-label">Success Rate</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                        <div class="metric-card">
                            <div class="metric-value">{dashboardData.totalApplicationsWithFeedback}</div>
                            <div class="metric-label">Applications</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="charts-container">
                <div class="slds-grid slds-wrap slds-gutters">
                    <!-- Performance Trend Chart -->
                    <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-3">
                        <div class="chart-container">
                            <div class="chart-header">
                                <h3 class="slds-text-heading_small">Performance Trend Over Time</h3>
                                <lightning-button-icon 
                                    icon-name="utility:expand" 
                                    variant="border-filled" 
                                    alternative-text="Expand Chart"
                                    title="Expand Chart"
                                    onclick={expandTrendChart}
                                    class="expand-button">
                                </lightning-button-icon>
                            </div>
                            <div class="chart-canvas-container">
                                <canvas 
                                    lwc:ref="trendChart" 
                                    class="chart-canvas"
                                    role="img"
                                    aria-label="Performance trend chart showing interview ratings over time">
                                </canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Competency Radar Chart -->
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                        <div class="chart-container">
                            <div class="chart-header">
                                <h3 class="slds-text-heading_small">Competency Analysis</h3>
                                <lightning-button-icon 
                                    icon-name="utility:expand" 
                                    variant="border-filled" 
                                    alternative-text="Expand Chart"
                                    title="Expand Chart"
                                    onclick={expandRadarChart}
                                    class="expand-button">
                                </lightning-button-icon>
                            </div>
                            <div class="chart-canvas-container">
                                <canvas 
                                    lwc:ref="radarChart" 
                                    class="chart-canvas"
                                    role="img"
                                    aria-label="Competency radar chart showing strengths and improvement areas">
                                </canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Competency Breakdown Chart -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <div class="chart-container">
                            <div class="chart-header">
                                <h3 class="slds-text-heading_small">Competency Breakdown</h3>
                            </div>
                            <div class="chart-canvas-container">
                                <canvas 
                                    lwc:ref="competencyChart" 
                                    class="chart-canvas"
                                    role="img"
                                    aria-label="Bar chart showing average ratings by competency area">
                                </canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Interview Type Distribution -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <div class="chart-container">
                            <div class="chart-header">
                                <h3 class="slds-text-heading_small">Interview Type Distribution</h3>
                            </div>
                            <div class="chart-canvas-container">
                                <canvas 
                                    lwc:ref="distributionChart" 
                                    class="chart-canvas"
                                    role="img"
                                    aria-label="Pie chart showing distribution of interview types">
                                </canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Feedback Section -->
            <div class="recent-feedback slds-m-top_large">
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">
                    <h3 class="slds-text-heading_small">Recent Interview Feedback</h3>
                    <lightning-button 
                        label="View All" 
                        onclick={viewAllFeedback}
                        variant="neutral">
                    </lightning-button>
                </div>
                
                <template if:true={hasRecentFeedback}>
                    <div class="feedback-list">
                        <template for:each={dashboardData.recentFeedback} for:item="feedback">
                            <div key={feedback.feedbackId} class="feedback-item" onclick={handleFeedbackClick} data-id={feedback.feedbackId}>
                                <div class="slds-grid slds-grid_align-spread">
                                    <div class="slds-col">
                                        <div class="feedback-type">{feedback.interviewType}</div>
                                        <div class="feedback-date">{feedback.formattedDate}</div>
                                    </div>
                                    <div class="slds-col slds-no-flex">
                                        <div class="feedback-rating">
                                            <lightning-icon 
                                                icon-name="utility:rating" 
                                                size="x-small" 
                                                class="rating-icon">
                                            </lightning-icon>
                                            {feedback.rating}/5
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:false={hasRecentFeedback}>
                    <div class="slds-illustration slds-illustration_small">
                        <div class="slds-text-color_weak slds-text-align_center">
                            <lightning-icon icon-name="utility:info" size="large" class="slds-m-bottom_small"></lightning-icon>
                            <h3 class="slds-text-heading_small">No Recent Feedback</h3>
                            <p>Start collecting interview feedback to see your performance analytics here.</p>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Insights and Recommendations -->
            <template if:true={hasInsights}>
                <div class="insights-section slds-m-top_large">
                    <h3 class="slds-text-heading_small slds-m-bottom_medium">Performance Insights</h3>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <template for:each={performanceInsights} for:item="insight">
                            <div key={insight.id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <div class="insight-card">
                                    <div class="insight-header">
                                        <lightning-icon 
                                            icon-name={insight.icon} 
                                            size="small" 
                                            variant={insight.variant}
                                            class="slds-m-right_small">
                                        </lightning-icon>
                                        <h4 class="insight-title">{insight.title}</h4>
                                    </div>
                                    <p class="insight-description">{insight.description}</p>
                                    <template if:true={insight.recommendation}>
                                        <div class="insight-recommendation">
                                            <strong>Recommendation:</strong> {insight.recommendation}
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </template>

        <!-- Chart Expansion Modal -->
        <template if:true={showExpandedChart}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeExpandedChart}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading" class="slds-modal__title slds-hyphenate">{expandedChartTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="expanded-chart-container">
                            <canvas 
                                lwc:ref="expandedChart" 
                                class="expanded-chart-canvas"
                                role="img"
                                aria-label={expandedChartAriaLabel}>
                            </canvas>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button 
                            variant="neutral" 
                            label="Close" 
                            onclick={closeExpandedChart}>
                        </lightning-button>
                        <lightning-button 
                            variant="brand" 
                            label="Export Chart" 
                            onclick={exportExpandedChart}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
