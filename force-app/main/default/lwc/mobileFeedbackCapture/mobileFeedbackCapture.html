<template>
    <div class="mobile-feedback-container" data-offline={isOffline}>
        <!-- Header with Status Indicators -->
        <div class="mobile-header slds-p-around_small">
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <div class="slds-col">
                    <h1 class="slds-text-heading_medium slds-text-color_default">
                        <lightning-icon icon-name="utility:feedback" size="small" class="slds-m-right_x-small"></lightning-icon>
                        Quick Feedback
                    </h1>
                </div>
                <div class="slds-col slds-no-flex">
                    <div class="status-indicators">
                        <!-- Offline Indicator -->
                        <template if:true={isOffline}>
                            <lightning-badge label="Offline" class="offline-badge slds-m-right_x-small"></lightning-badge>
                        </template>
                        <!-- Sync Status -->
                        <template if:true={hasPendingSync}>
                            <lightning-badge label="Sync Pending" class="sync-badge slds-m-right_x-small"></lightning-badge>
                        </template>
                        <!-- Location Status -->
                        <template if:true={locationEnabled}>
                            <lightning-icon icon-name="utility:location" size="xx-small" class="location-icon"></lightning-icon>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- Progress Indicator -->
        <div class="progress-container slds-p-horizontal_small">
            <lightning-progress-indicator 
                current-step={currentStep} 
                type="base" 
                variant="base">
                <lightning-progress-step label="Basic Info" value="basic"></lightning-progress-step>
                <lightning-progress-step label="Ratings" value="ratings"></lightning-progress-step>
                <lightning-progress-step label="Media" value="media"></lightning-progress-step>
                <lightning-progress-step label="Review" value="review"></lightning-progress-step>
            </lightning-progress-indicator>
        </div>

        <!-- Main Content Area -->
        <div class="mobile-content slds-scrollable_y">
            
            <!-- Step 1: Basic Information -->
            <template if:true={isBasicStep}>
                <div class="step-container fade-in">
                    <div class="slds-card slds-m-around_small">
                        <div class="slds-card__body slds-p-around_medium">
                            
                            <!-- Job Application Selection -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <label class="slds-form-element__label slds-text-body_regular">
                                    <abbr class="slds-required" title="required">*</abbr>
                                    Job Application
                                </label>
                                <div class="slds-form-element__control">
                                    <lightning-combobox
                                        name="jobApplication"
                                        value={selectedJobApplicationId}
                                        placeholder="Select job application..."
                                        options={jobApplicationOptions}
                                        onchange={handleJobApplicationChange}
                                        required
                                        class="mobile-input">
                                    </lightning-combobox>
                                </div>
                            </div>

                            <!-- Interview Type -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <label class="slds-form-element__label slds-text-body_regular">
                                    <abbr class="slds-required" title="required">*</abbr>
                                    Interview Type
                                </label>
                                <div class="slds-form-element__control">
                                    <lightning-radio-group
                                        name="interviewType"
                                        value={feedbackData.interviewType}
                                        options={interviewTypeOptions}
                                        onchange={handleInterviewTypeChange}
                                        type="button"
                                        class="mobile-radio-group">
                                    </lightning-radio-group>
                                </div>
                            </div>

                            <!-- Interview Date -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <label class="slds-form-element__label slds-text-body_regular">
                                    <abbr class="slds-required" title="required">*</abbr>
                                    Interview Date
                                </label>
                                <div class="slds-form-element__control">
                                    <lightning-input
                                        type="datetime-local"
                                        name="interviewDate"
                                        value={feedbackData.interviewDate}
                                        onchange={handleInterviewDateChange}
                                        required
                                        class="mobile-input">
                                    </lightning-input>
                                </div>
                            </div>

                            <!-- Quick Notes -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <label class="slds-form-element__label slds-text-body_regular">
                                    Quick Notes
                                </label>
                                <div class="slds-form-element__control">
                                    <lightning-textarea
                                        name="quickNotes"
                                        value={feedbackData.quickNotes}
                                        placeholder="Tap to add quick notes..."
                                        onchange={handleQuickNotesChange}
                                        rows="3"
                                        class="mobile-textarea">
                                    </lightning-textarea>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </template>

            <!-- Step 2: Ratings with Touch Sliders -->
            <template if:true={isRatingsStep}>
                <div class="step-container fade-in">
                    <div class="slds-card slds-m-around_small">
                        <div class="slds-card__body slds-p-around_medium">
                            
                            <!-- Overall Rating -->
                            <div class="rating-section slds-m-bottom_large">
                                <h3 class="slds-text-heading_small slds-m-bottom_medium">Overall Rating</h3>
                                <div class="touch-slider-container">
                                    <div class="slider-label-container slds-grid slds-grid_align-spread">
                                        <span class="slider-label">Poor</span>
                                        <span class="slider-value">{feedbackData.overallRating}/5</span>
                                        <span class="slider-label">Excellent</span>
                                    </div>
                                    <input 
                                        type="range" 
                                        min="1" 
                                        max="5" 
                                        step="0.5"
                                        value={feedbackData.overallRating}
                                        class="touch-slider overall-slider"
                                        onchange={handleOverallRatingChange}
                                        ontouchmove={handleSliderTouch}
                                        ontouchend={handleSliderTouchEnd}>
                                    <div class="slider-track">
                                        <div class="slider-fill" style={overallRatingFillStyle}></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Competency Ratings -->
                            <div class="competency-ratings">
                                <h3 class="slds-text-heading_small slds-m-bottom_medium">Competency Ratings</h3>
                                <template for:each={competencyRatings} for:item="competency">
                                    <div key={competency.name} class="competency-rating slds-m-bottom_medium">
                                        <div class="competency-header slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                                            <span class="competency-name">{competency.name}</span>
                                            <span class="competency-value">{competency.rating}/5</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            min="1" 
                                            max="5" 
                                            step="0.5"
                                            value={competency.rating}
                                            class="touch-slider competency-slider"
                                            data-competency={competency.name}
                                            onchange={handleCompetencyRatingChange}
                                            ontouchmove={handleSliderTouch}
                                            ontouchend={handleSliderTouchEnd}>
                                        <div class="slider-track">
                                            <div class="slider-fill" style={competency.fillStyle}></div>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <!-- Quick Feedback Buttons -->
                            <div class="quick-feedback-section slds-m-top_large">
                                <h3 class="slds-text-heading_small slds-m-bottom_medium">Quick Feedback</h3>
                                <div class="quick-feedback-buttons">
                                    <template for:each={quickFeedbackOptions} for:item="option">
                                        <lightning-button
                                            key={option.value}
                                            label={option.label}
                                            variant={option.selected}
                                            size="small"
                                            data-value={option.value}
                                            onclick={handleQuickFeedbackToggle}
                                            class="quick-feedback-btn slds-m-around_xx-small">
                                        </lightning-button>
                                    </template>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </template>

            <!-- Step 3: Media Capture -->
            <template if:true={isMediaStep}>
                <div class="step-container fade-in">
                    <div class="slds-card slds-m-around_small">
                        <div class="slds-card__body slds-p-around_medium">
                            
                            <!-- Voice Memo Section -->
                            <template if:true={enableVoiceMemos}>
                                <div class="voice-memo-section slds-m-bottom_large">
                                    <h3 class="slds-text-heading_small slds-m-bottom_medium">
                                        <lightning-icon icon-name="utility:record" size="small" class="slds-m-right_x-small"></lightning-icon>
                                        Voice Memo
                                    </h3>
                                    
                                    <div class="voice-controls slds-text-align_center">
                                        <template if:false={isRecording}>
                                            <lightning-button
                                                variant="brand"
                                                label="Start Recording"
                                                icon-name="utility:record"
                                                onclick={startVoiceRecording}
                                                class="record-button">
                                            </lightning-button>
                                        </template>
                                        
                                        <template if:true={isRecording}>
                                            <div class="recording-controls">
                                                <div class="recording-indicator slds-m-bottom_small">
                                                    <div class="recording-dot"></div>
                                                    <span class="recording-time">{recordingTime}</span>
                                                </div>
                                                <div class="recording-buttons">
                                                    <lightning-button
                                                        variant="destructive"
                                                        label="Stop"
                                                        icon-name="utility:stop"
                                                        onclick={stopVoiceRecording}
                                                        class="slds-m-right_small">
                                                    </lightning-button>
                                                    <lightning-button
                                                        variant="neutral"
                                                        label="Cancel"
                                                        onclick={cancelVoiceRecording}>
                                                    </lightning-button>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Voice Memo Playback -->
                                    <template if:true={hasVoiceMemo}>
                                        <div class="voice-playback slds-m-top_medium">
                                            <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                                                <div class="slds-col slds-no-flex">
                                                    <lightning-button-icon
                                                        icon-name={playButtonIcon}
                                                        variant="border-filled"
                                                        onclick={toggleVoicePlayback}
                                                        class="play-button">
                                                    </lightning-button-icon>
                                                </div>
                                                <div class="slds-col slds-grow slds-m-left_small">
                                                    <div class="audio-progress">
                                                        <div class="audio-progress-bar" style={audioProgressStyle}></div>
                                                    </div>
                                                    <div class="audio-duration slds-text-body_small slds-text-color_weak">
                                                        {voiceMemoLength}s
                                                    </div>
                                                </div>
                                                <div class="slds-col slds-no-flex">
                                                    <lightning-button-icon
                                                        icon-name="utility:delete"
                                                        variant="border-filled"
                                                        onclick={deleteVoiceMemo}
                                                        class="delete-button">
                                                    </lightning-button-icon>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- Photo Attachments Section -->
                            <template if:true={enablePhotoAttachments}>
                                <div class="photo-section slds-m-bottom_large">
                                    <h3 class="slds-text-heading_small slds-m-bottom_medium">
                                        <lightning-icon icon-name="utility:photo" size="small" class="slds-m-right_x-small"></lightning-icon>
                                        Photos ({attachedPhotos.length}/{maxPhotos})
                                    </h3>
                                    
                                    <!-- Photo Upload -->
                                    <template if:true={canAddMorePhotos}>
                                        <div class="photo-upload slds-m-bottom_medium">
                                            <input 
                                                type="file" 
                                                accept="image/*" 
                                                capture="environment"
                                                multiple
                                                onchange={handlePhotoUpload}
                                                class="photo-input"
                                                lwc:ref="photoInput">
                                            <lightning-button
                                                variant="outline-brand"
                                                label="Add Photos"
                                                icon-name="utility:add"
                                                onclick={triggerPhotoUpload}
                                                class="photo-upload-btn">
                                            </lightning-button>
                                        </div>
                                    </template>

                                    <!-- Photo Gallery -->
                                    <template if:true={hasPhotos}>
                                        <div class="photo-gallery">
                                            <template for:each={attachedPhotos} for:item="photo">
                                                <div key={photo.id} class="photo-item">
                                                    <div class="photo-container">
                                                        <img src={photo.url} alt={photo.name} class="photo-thumbnail">
                                                        <div class="photo-overlay">
                                                            <lightning-button-icon
                                                                icon-name="utility:delete"
                                                                variant="inverse"
                                                                size="small"
                                                                data-photo-id={photo.id}
                                                                onclick={deletePhoto}
                                                                class="delete-photo-btn">
                                                            </lightning-button-icon>
                                                        </div>
                                                    </div>
                                                    <div class="photo-name slds-text-body_small slds-text-align_center slds-truncate">
                                                        {photo.name}
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- Location Capture -->
                            <template if:true={enableLocationCapture}>
                                <div class="location-section">
                                    <h3 class="slds-text-heading_small slds-m-bottom_medium">
                                        <lightning-icon icon-name="utility:location" size="small" class="slds-m-right_x-small"></lightning-icon>
                                        Interview Location
                                    </h3>
                                    
                                    <template if:false={hasLocation}>
                                        <lightning-button
                                            variant="outline-brand"
                                            label="Capture Location"
                                            icon-name="utility:location"
                                            onclick={captureLocation}
                                            disabled={isCapturingLocation}
                                            class="location-btn">
                                        </lightning-button>
                                        <template if:true={isCapturingLocation}>
                                            <div class="location-loading slds-m-top_small">
                                                <lightning-spinner size="small" alternative-text="Getting location..."></lightning-spinner>
                                                <span class="slds-text-body_small slds-text-color_weak">Getting your location...</span>
                                            </div>
                                        </template>
                                    </template>

                                    <template if:true={hasLocation}>
                                        <div class="location-display slds-box slds-theme_default">
                                            <div class="slds-grid slds-grid_align-spread">
                                                <div class="slds-col slds-grow">
                                                    <div class="location-coords slds-text-body_small">
                                                        <strong>Coordinates:</strong> {locationData.latitude}, {locationData.longitude}
                                                    </div>
                                                    <template if:true={locationData.address}>
                                                        <div class="location-address slds-text-body_small slds-text-color_weak">
                                                            {locationData.address}
                                                        </div>
                                                    </template>
                                                </div>
                                                <div class="slds-col slds-no-flex">
                                                    <lightning-button-icon
                                                        icon-name="utility:delete"
                                                        variant="border-filled"
                                                        onclick={clearLocation}
                                                        class="clear-location-btn">
                                                    </lightning-button-icon>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                        </div>
                    </div>
                </div>
            </template>

            <!-- Step 4: Review and Submit -->
            <template if:true={isReviewStep}>
                <div class="step-container fade-in">
                    <div class="slds-card slds-m-around_small">
                        <div class="slds-card__body slds-p-around_medium">
                            
                            <h3 class="slds-text-heading_small slds-m-bottom_medium">Review Your Feedback</h3>
                            
                            <!-- Basic Info Summary -->
                            <div class="review-section slds-m-bottom_medium">
                                <h4 class="slds-text-body_regular slds-text-color_default slds-m-bottom_small">Basic Information</h4>
                                <div class="review-item">
                                    <span class="review-label">Interview Type:</span>
                                    <span class="review-value">{feedbackData.interviewType}</span>
                                </div>
                                <div class="review-item">
                                    <span class="review-label">Date:</span>
                                    <span class="review-value">{formattedInterviewDate}</span>
                                </div>
                                <template if:true={feedbackData.quickNotes}>
                                    <div class="review-item">
                                        <span class="review-label">Notes:</span>
                                        <span class="review-value">{feedbackData.quickNotes}</span>
                                    </div>
                                </template>
                            </div>

                            <!-- Ratings Summary -->
                            <div class="review-section slds-m-bottom_medium">
                                <h4 class="slds-text-body_regular slds-text-color_default slds-m-bottom_small">Ratings</h4>
                                <div class="review-item">
                                    <span class="review-label">Overall Rating:</span>
                                    <span class="review-value rating-display">{feedbackData.overallRating}/5 ⭐</span>
                                </div>
                                <template for:each={competencyRatings} for:item="competency">
                                    <div key={competency.name} class="review-item">
                                        <span class="review-label">{competency.name}:</span>
                                        <span class="review-value">{competency.rating}/5</span>
                                    </div>
                                </template>
                            </div>

                            <!-- Media Summary -->
                            <div class="review-section slds-m-bottom_medium">
                                <h4 class="slds-text-body_regular slds-text-color_default slds-m-bottom_small">Attachments</h4>
                                <div class="review-item">
                                    <span class="review-label">Voice Memo:</span>
                                    <span class="review-value">{hasVoiceMemo ? 'Yes' : 'No'}</span>
                                </div>
                                <div class="review-item">
                                    <span class="review-label">Photos:</span>
                                    <span class="review-value">{attachedPhotos.length} attached</span>
                                </div>
                                <template if:true={hasLocation}>
                                    <div class="review-item">
                                        <span class="review-label">Location:</span>
                                        <span class="review-value">Captured</span>
                                    </div>
                                </template>
                            </div>

                        </div>
                    </div>
                </div>
            </template>

        </div>

        <!-- Navigation Footer -->
        <div class="mobile-footer slds-p-around_small">
            <div class="slds-grid slds-grid_align-spread">
                <div class="slds-col">
                    <template if:false={isFirstStep}>
                        <lightning-button
                            variant="neutral"
                            label="Previous"
                            icon-name="utility:chevronleft"
                            icon-position="left"
                            onclick={handlePrevious}
                            class="nav-button">
                        </lightning-button>
                    </template>
                </div>
                <div class="slds-col">
                    <template if:false={isLastStep}>
                        <lightning-button
                            variant="brand"
                            label="Next"
                            icon-name="utility:chevronright"
                            icon-position="right"
                            onclick={handleNext}
                            disabled={!canProceedToNext}
                            class="nav-button">
                        </lightning-button>
                    </template>
                    <template if:true={isLastStep}>
                        <lightning-button
                            variant="success"
                            label={submitButtonLabel}
                            icon-name="utility:check"
                            onclick={handleSubmit}
                            disabled={isSubmitting}
                            class="submit-button">
                        </lightning-button>
                    </template>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <template if:true={isSubmitting}>
            <div class="loading-overlay">
                <div class="loading-content">
                    <lightning-spinner size="medium" alternative-text="Saving feedback..."></lightning-spinner>
                    <div class="loading-text slds-m-top_small">
                        {loadingMessage}
                    </div>
                </div>
            </div>
        </template>

        <!-- Toast Messages -->
        <template if:true={showToast}>
            <div class="mobile-toast" data-variant={toastVariant}>
                <div class="toast-content">
                    <lightning-icon icon-name={toastIcon} size="small" class="toast-icon"></lightning-icon>
                    <span class="toast-message">{toastMessage}</span>
                </div>
                <lightning-button-icon
                    icon-name="utility:close"
                    variant="bare"
                    size="small"
                    onclick={hideToast}
                    class="toast-close">
                </lightning-button-icon>
            </div>
        </template>

        <!-- Offline Storage Indicator -->
        <template if:true={hasOfflineData}>
            <div class="offline-storage-indicator">
                <lightning-icon icon-name="utility:offline" size="xx-small"></lightning-icon>
                <span class="offline-count">{offlineDataCount}</span>
            </div>
        </template>

    </div>
</template>
